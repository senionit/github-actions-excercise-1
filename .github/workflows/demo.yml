name: Deploy website

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Linting code
        run: npm run lint

      - name: Testing code
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
        - name: Checkout repository
          uses: actions/checkout@v3

        - name: Install dependencies
          run: npm ci

        - name: Building code
          run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        run: echo "Deploying...."

